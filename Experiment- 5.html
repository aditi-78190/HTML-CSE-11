<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            text-align: center;
        }

        hr {
            border: 1px solid #000;
        }

        form {
            width: 45%;
            margin-left: 80px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 8px;
            vertical-align: top;
        }

        input, select, textarea {
            width: 95%;
            padding: 5px;
            font-size: 14px;
        }

        input[type="radio"] {
            width: auto;
        }

        .buttons {
            text-align: left;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 90px;
            padding: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 8px;
        }

        footer {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>Student Registration Form</h2>
    <hr>

    <form method="post" action="submit.html">
        <table>
            <tr>
                <td><label for="fullname">Full Name:</label></td>
                <td><input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required></td>
            </tr>
            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email" placeholder="Enter valid email address" required></td>
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password" placeholder="Enter password" required></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="Male" required> Male
                    <input type="radio" name="gender" value="Female"> Female
                    <input type="radio" name="gender" value="Other"> Other
                </td>
            </tr>
            <tr>
                <td><label for="course">Course:</label></td>
                <td>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="bca">BCA</option>
                        <option value="bsc">B.Sc</option>
                        <option value="bcom">B.Com</option>
                        <option value="ba">B.A</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="contact">Contact No:</label></td>
                <td><input type="tel" id="contact" name="contact" placeholder="Enter phone number" required></td>
            </tr>
            <tr>
                <td><label for="address">Address:</label></td>
                <td><textarea id="address" name="address" placeholder="Enter your address" required></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td class="buttons">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

    <hr>
    <footer>
        &copy; 2025 Student Registration Portal
    </footer>

      <!-- ADITI GUPTA (2025B01010647) -->
</body>
</html>
